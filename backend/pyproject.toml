[project]
name = "hcp-crm-backend"
version = "0.1.0"
description = "AI-first HCP CRM backend — FastAPI + LangGraph + Groq"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",

    # Database
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.12",

    # Validation & config
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",

    # LangChain / LangGraph / Groq  (1.x stack, resolved 2026-07-09)
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langchain-groq==1.1.3",
    "langgraph==1.2.8",
    "langgraph-prebuilt==1.1.0",

    # HTTP client (used internally by langchain-groq)
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",   # for FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only package the application source, not tests or scripts
packages = ["."]

[tool.uv]
# Pin the resolution strategy so uv lock produces a reproducible environment.
resolution = "lowest-direct"
